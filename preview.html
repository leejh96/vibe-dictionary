        const hints = [
          { level: 1, title: '1단계 힌트: 생각의 실마리', body: '짝수는 2로 나누었을 때 나머지가 0인 숫자예요.' },
          { level: 2, title: '2단계 힌트: 사용할 연산자', body: '나머지를 구할 때는 % 기호를 사용해요.' },
          { level: 3, title: '3단계 힌트: 정답 코드 보기', body: 'if num % 2 == 0:' },
        ];
        return (
          <div className="relative w-full h-44 flex flex-col justify-center px-4 select-none">
            <div className="space-y-1.5">
              {hints.map((h) => {
                const isOpen = unlocked >= h.level;
                const canUnlockNext = unlocked + 1 === h.level;
                return (
                  <div key={h.level} onClick={() => { if (canUnlockNext) setUnlocked(h.level); else if (h.level === 3 && unlocked === 3) setUnlocked(1); }} className={`rounded-lg border px-3 py-1.5 transition-all ${isOpen ? 'bg-slate-800/90 border-indigo-500/50 text-slate-100' : canUnlockNext ? 'bg-slate-900/90 border-slate-700 cursor-pointer text-amber-300' : 'bg-slate-950/60 border-slate-800/70 text-slate-600'}`}>
                    <div className="flex items-center justify-between text-[11px] font-bold">
                      <span>{isOpen ? '🔓' : '🔒'} {h.title}</span>
                      {canUnlockNext && <span className="text-[10px] underline">클릭해 열기</span>}
                    </div>
                    {isOpen && <p className="mt-1 text-[11px] text-indigo-200 font-mono truncate">👉 {h.body}</p>}
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      const InteractiveDemo = ({ techniqueId }) => {
        switch (techniqueId) {
          case 'card-flip-3d': return <CardFlipDemo />;
          case 'confetti-burst': return <ConfettiBurstDemo />;
          case 'error-shake-tooltip': return <ErrorShakeDemo />;
          case 'magnetic-hover': return <MagneticHoverDemo />;
          case 'spring-bounce-modal': return <SpringBounceDemo />;
          case 'typewriter-streaming': return <TypewriterDemo />;
          case 'staggered-list': return <StaggeredListDemo />;
          case 'drag-snap-slot': return <DragSnapSlotDemo />;
          case 'spotlight-focus': return <SpotlightFocusDemo />;
          case 'combo-gauge-pop': return <ComboGaugeDemo />;
          case 'step-line-highlighter': return <StepLineHighlighterDemo />;
          case 'progressive-hint-accordion': return <ProgressiveHintDemo />;
          default: return null;
        }
      };

      function App() {
        const [searchQuery, setSearchQuery] = useState('');
        const [selectedSituation, setSelectedSituation] = useState('all');
        const [cart, setCart] = useState([TECHNIQUES[0], TECHNIQUES[1]]);
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [topic, setTopic] = useState('초등학생용 파이썬 if-else 조건문으로 신호등 건너기 퀴즈');
        const [copiedId, setCopiedId] = useState(null);
        const [copiedCart, setCopiedCart] = useState(false);

        const filteredTechniques = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          return TECHNIQUES.filter((item) => {
            const matchSituation = selectedSituation === 'all' || item.situations.includes(selectedSituation);
            if (!q) return matchSituation;
            const text = [item.titleKo, item.titleEn, item.vibePhrase, item.plainDescription, item.whyItWorks, ...item.vibeKeywords].join(' ').toLowerCase();
            return matchSituation && text.includes(q);
          });
        }, [searchQuery, selectedSituation]);

        const toggleCart = (item) => {
          setCart((prev) => prev.some((i) => i.id === item.id) ? prev.filter((i) => i.id !== item.id) : [...prev, item]);
        };

        const combinedPrompt = useMemo(() => {
          if (cart.length === 0) return '카탈로그에서 기법을 선택해 주세요.';
          return `당신은 인터랙티브 코딩 교육 콘텐츠 전문 프론트엔드 개발자입니다.\n다음 교육 주제에 맞춰 아래 지정된 UI/모션 인터랙션 기법들이 실제로 살아 움직이는 교육용 웹 콘텐츠를 구현해 주세요.\n\n## 1. 교육 주제\n- ${topic}\n\n## 2. 필수 적용 인터랙션 기법 (${cart.length}종)\n` +
            cart.map((item, idx) => `${idx + 1}. **${item.titleKo} (${item.titleEn})** - [원하는 느낌: "${item.vibePhrase}"]\n   - 구현 지침: ${item.promptSnippet}\n   - 핵심 힌트: \`${item.codeHint}\``).join('\n\n');
        }, [cart, topic]);

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 pb-24">
            <header className="border-b border-slate-800/80 bg-slate-950/90 sticky top-0 z-30 backdrop-blur-md">
              <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div>
                  <h1 className="text-xl font-black text-white">📖 보고 고르는 바이브 사전 (Vibe UI Dictionary)</h1>
                  <p className="text-xs text-slate-400">전문 용어를 몰라도 눈으로 보고 고르면 AI 바이브코딩 프롬프트로 번역해 드립니다.</p>
                </div>
                <button onClick={() => setIsCartOpen(true)} className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white">
                  🪄 프롬프트 조합기 ({cart.length})
                </button>
              </div>
            </header>

            <main className="max-w-7xl mx-auto px-4 pt-6 space-y-6">
              <section className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="느낌·의성어로 검색해 보세요! 예: '통통 튀는', '착 달라붙는', '부르르 떨리는', '촤르륵', '팡 터지는'..."
                  className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                />
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-xs text-slate-400 mr-1">빠른 느낌 검색:</span>
                  {QUICK_VIBE_CHIPS.map((chip) => (
                    <button key={chip} onClick={() => setSearchQuery(searchQuery === chip ? '' : chip)} className={`text-xs px-2.5 py-1 rounded-full border ${searchQuery === chip ? 'bg-indigo-600 text-white border-indigo-400 font-bold' : 'bg-slate-950 text-slate-300 border-slate-800'}`}>
                      "{chip}"
                    </button>
                  ))}
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 pt-2">
                  {SITUATION_CATEGORIES.map((cat) => (
                    <button key={cat.id} onClick={() => setSelectedSituation(cat.id)} className={`p-3 rounded-xl border text-left ${selectedSituation === cat.id ? 'bg-indigo-600/20 border-indigo-500 text-white' : 'bg-slate-950/60 border-slate-800 text-slate-300'}`}>
                      <div className="text-sm font-bold">{cat.emoji} {cat.label}</div>
                    </button>
                  ))}
                </div>
              </section>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {filteredTechniques.map((item) => {
                  const isSelected = cart.some((c) => c.id === item.id);
                  return (
                    <article key={item.id} className={`rounded-2xl border flex flex-col overflow-hidden ${isSelected ? 'bg-slate-900 border-indigo-500 ring-2 ring-indigo-500/30' : 'bg-slate-900/60 border-slate-800'}`}>
                      <div className="bg-slate-950/90 border-b border-slate-800">
                        <InteractiveDemo techniqueId={item.id} />
                      </div>
                      <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                        <div className="space-y-2">
                          <div className="inline-block text-xs font-semibold text-amber-300 bg-amber-950/50 border border-amber-700/40 px-2.5 py-1 rounded-lg">
                            💬 "{item.vibePhrase}" ➔ 전문 용어
                          </div>
                          <h3 className="text-lg font-extrabold text-white">{item.titleKo}</h3>
                          <p className="text-xs font-mono text-indigo-400">{item.titleEn}</p>
                          <p className="text-xs text-slate-300 leading-relaxed">{item.plainDescription}</p>
                          <div className="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5 text-[11px] text-slate-300">
                            <strong className="text-emerald-300">🎓 교육 효과: </strong>{item.whyItWorks}
                          </div>
                        </div>
                        <div className="flex items-center gap-2 pt-2">
                          <button
                            onClick={() => {
                              navigator.clipboard.writeText(`[${item.titleKo} / ${item.titleEn}]\n${item.promptSnippet}`);
                              setCopiedId(item.id);
                              setTimeout(() => setCopiedId(null), 1500);
                            }}
                            className="flex-1 py-2.5 px-3 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold text-slate-200"
                          >
                            {copiedId === item.id ? '✅ 복사됨!' : '📋 단건 복사'}
                          </button>
                          <button
                            onClick={() => toggleCart(item)}
                            className={`flex-1 py-2.5 px-3 rounded-xl text-xs font-bold ${isSelected ? 'bg-rose-500/20 border border-rose-500/50 text-rose-200' : 'bg-indigo-600 text-white'}`}
                          >
                            {isSelected ? '장바구니 빼기' : '+ 장바구니 담기'}
                          </button>
                        </div>
                      </div>
                    </article>
                  );
                })}
              </div>
            </main>

            {isCartOpen && (
              <div className="fixed inset-0 z-50 flex justify-end bg-black/70 backdrop-blur-sm">
                <div className="w-full max-w-2xl bg-slate-900 border-l border-slate-800 h-full flex flex-col p-6 space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <h2 className="text-base font-extrabold text-white">🪄 바이브코딩 통합 프롬프트 조합기</h2>
                    <button onClick={() => setIsCartOpen(false)} className="text-slate-400 hover:text-white text-sm font-bold">✕ 닫기</button>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-indigo-300 mb-1">이번에 만들 코딩 교육 콘텐츠 주제</label>
                    <input type="text" value={topic} onChange={(e) => setTopic(e.target.value)} className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-sm text-white" />
                  </div>
                  <pre className="flex-1 overflow-y-auto p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 font-mono whitespace-pre-wrap leading-relaxed">
                    {combinedPrompt}
                  </pre>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(combinedPrompt);
                      setCopiedCart(true);
                      setTimeout(() => setCopiedCart(false), 1800);
                    }}
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 font-extrabold text-sm text-white"
                  >
                    {copiedCart ? '✅ 클립보드에 통합 프롬프트 복사 완료!' : `📋 통합 바이브코딩 프롬프트 복사하기 (${cart.length}개 기법)`}
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
